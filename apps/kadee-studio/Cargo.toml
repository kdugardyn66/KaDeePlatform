[package]
name = "kadee-studio"
build = "build.rs"
description = "KadeeStudio on the KaDee Platform — the GPUI desktop app: window, shell and Start screen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
kd-commands.workspace = true
kd-store.workspace = true
kd-ai.workspace = true
kd-ui.workspace = true
kd-markdown.workspace = true
kd-formats.workspace = true
directories.workspace = true
gpui.workspace = true
chrono.workspace = true
# Delete file / Delete folder: to the Trash or Recycle Bin.
trash = "5"
env_logger = "0.11"

[features]
default = []
# Compile GPUI's Metal shaders when the app starts instead of at build time (macOS without the
# Metal Toolchain; scripts/build-macos.sh turns it on by itself when needed).
runtime-shaders = ["gpui/runtime_shaders"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
